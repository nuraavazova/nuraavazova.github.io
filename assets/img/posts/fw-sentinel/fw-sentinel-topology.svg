<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-label="Topology: client traffic goes through the firewall trust and untrust interfaces to the internet; firewall logs go from the management interface to a log forwarder and on to Microsoft Sentinel." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#152028"/></marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b8a8a"/></marker>
  </defs>
  <style>
    .t{font-family:Helvetica,Arial,sans-serif}
    .m{font-family:Menlo,Consolas,monospace}
  </style>
  <rect width="980" height="440" fill="#ffffff"/>

  <!-- VNet -->
  <rect x="12" y="40" width="760" height="384" rx="12" fill="none" stroke="#5b6b78" stroke-dasharray="5 5"/>
  <text class="m" x="28" y="30" font-size="12.5" fill="#5b6b78">vnet-fw-lab · 10.20.0.0/16</text>

  <!-- Client -->
  <rect x="32" y="76" width="150" height="104" rx="10" fill="#2a6fd6" fill-opacity=".10" stroke="#2a6fd6" stroke-width="1.5"/>
  <text class="t" x="107" y="102" text-anchor="middle" font-weight="700" font-size="15" fill="#2a6fd6">snet-client</text>
  <text class="m" x="107" y="120" text-anchor="middle" font-size="11.5" fill="#5b6b78">10.20.3.0/24</text>
  <text class="t" x="107" y="144" text-anchor="middle" font-size="13" fill="#152028">client01</text>
  <text class="m" x="107" y="162" text-anchor="middle" font-size="12" fill="#152028">10.20.3.10</text>

  <!-- UDR -->
  <rect x="32" y="202" width="150" height="54" rx="8" fill="#ffffff" stroke="#2a6fd6" stroke-dasharray="3 3"/>
  <text class="t" x="107" y="224" text-anchor="middle" font-weight="700" font-size="12.5" fill="#152028">rt-client (UDR)</text>
  <text class="m" x="107" y="242" text-anchor="middle" font-size="11" fill="#5b6b78">0.0.0.0/0 → 10.20.2.4</text>
  <line x1="107" y1="180" x2="107" y2="202" stroke="#2a6fd6" stroke-dasharray="3 3"/>

  <!-- Trust -->
  <rect x="216" y="76" width="140" height="104" rx="10" fill="#1f8a5b" fill-opacity=".10" stroke="#1f8a5b" stroke-width="1.5"/>
  <text class="t" x="286" y="102" text-anchor="middle" font-weight="700" font-size="15" fill="#1f8a5b">snet-trust</text>
  <text class="m" x="286" y="120" text-anchor="middle" font-size="11.5" fill="#5b6b78">10.20.2.0/24</text>
  <text class="t" x="286" y="144" text-anchor="middle" font-size="13" fill="#152028">ethernet1/2 · Trust</text>
  <text class="m" x="286" y="162" text-anchor="middle" font-size="12" fill="#152028">10.20.2.4</text>

  <!-- Firewall -->
  <rect x="390" y="62" width="180" height="132" rx="12" fill="#0b6e8a" fill-opacity=".12" stroke="#0b6e8a" stroke-width="2.2"/>
  <text class="t" x="480" y="90" text-anchor="middle" font-weight="700" font-size="16" fill="#152028">fw01 · VM-Series</text>
  <text class="t" x="480" y="114" text-anchor="middle" font-size="12.5" fill="#152028">rule allow-web-out</text>
  <text class="t" x="480" y="134" text-anchor="middle" font-size="12.5" fill="#152028">NAT client-snat</text>
  <text class="t" x="480" y="154" text-anchor="middle" font-size="12.5" fill="#152028">log fwd LF-Sentinel</text>
  <text class="m" x="480" y="178" text-anchor="middle" font-size="11" fill="#5b6b78">3 NICs</text>

  <!-- Untrust -->
  <rect x="604" y="76" width="150" height="104" rx="10" fill="#c8502f" fill-opacity=".10" stroke="#c8502f" stroke-width="1.5"/>
  <text class="t" x="679" y="102" text-anchor="middle" font-weight="700" font-size="15" fill="#c8502f">snet-untrust</text>
  <text class="m" x="679" y="120" text-anchor="middle" font-size="11.5" fill="#5b6b78">10.20.1.0/24</text>
  <text class="t" x="679" y="144" text-anchor="middle" font-size="13" fill="#152028">ethernet1/1 · Untrust</text>
  <text class="m" x="679" y="162" text-anchor="middle" font-size="11" fill="#152028">10.20.1.4 + pub IP</text>

  <!-- Internet -->
  <rect x="808" y="90" width="152" height="76" rx="10" fill="#ffffff" stroke="#5b6b78"/>
  <text class="t" x="884" y="122" text-anchor="middle" font-weight="700" font-size="15" fill="#152028">Internet</text>
  <text class="t" x="884" y="142" text-anchor="middle" font-size="12" fill="#5b6b78">public website</text>

  <!-- client flow -->
  <path d="M182 128H214" stroke="#152028" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M356 128H388" stroke="#152028" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M570 128H602" stroke="#152028" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M754 128H806" stroke="#152028" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="m" x="780" y="120" text-anchor="middle" font-size="10.5" fill="#5b6b78">SNAT</text>

  <!-- Mgmt -->
  <rect x="390" y="268" width="180" height="96" rx="10" fill="#7a4fc4" fill-opacity=".10" stroke="#7a4fc4" stroke-width="1.5"/>
  <text class="t" x="480" y="294" text-anchor="middle" font-weight="700" font-size="15" fill="#7a4fc4">snet-mgmt</text>
  <text class="m" x="480" y="312" text-anchor="middle" font-size="11.5" fill="#5b6b78">10.20.0.0/24</text>
  <text class="t" x="480" y="334" text-anchor="middle" font-size="13" fill="#152028">MGT · admin + syslog source</text>
  <text class="m" x="480" y="352" text-anchor="middle" font-size="12" fill="#152028">10.20.0.4</text>
  <line x1="480" y1="194" x2="480" y2="268" stroke="#7a4fc4" stroke-width="1.5"/>
  <text class="m" x="490" y="236" font-size="10.5" fill="#5b6b78">same VM, NIC 1</text>
  <text class="t" x="300" y="306" text-anchor="end" font-size="12" fill="#5b6b78">HTTPS 443 from one /32</text>
  <path d="M304 302H386" stroke="#7a4fc4" stroke-dasharray="2 3" marker-end="url(#ah)"/>

  <!-- Logs -->
  <rect x="604" y="268" width="150" height="96" rx="10" fill="#0b8a8a" fill-opacity=".10" stroke="#0b8a8a" stroke-width="1.5"/>
  <text class="t" x="679" y="294" text-anchor="middle" font-weight="700" font-size="15" fill="#0b8a8a">snet-logs</text>
  <text class="m" x="679" y="312" text-anchor="middle" font-size="11.5" fill="#5b6b78">10.20.4.0/24</text>
  <text class="t" x="679" y="334" text-anchor="middle" font-size="13" fill="#152028">log-fwd01 rsyslog+AMA</text>
  <text class="m" x="679" y="352" text-anchor="middle" font-size="12" fill="#152028">10.20.4.10</text>
  <path d="M570 316H602" stroke="#0b8a8a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahl)"/>
  <text class="m" x="586" y="386" text-anchor="middle" font-size="10.5" fill="#0b8a8a">TCP 514</text>
  <line x1="586" y1="320" x2="586" y2="374" stroke="#0b8a8a" stroke-width=".8" stroke-dasharray="2 3"/>

  <!-- Sentinel -->
  <rect x="808" y="268" width="152" height="96" rx="10" fill="#ffffff" stroke="#8a6d0b" stroke-width="1.5"/>
  <text class="t" x="884" y="296" text-anchor="middle" font-weight="700" font-size="15" fill="#8a6d0b">Sentinel</text>
  <text class="m" x="884" y="316" text-anchor="middle" font-size="11" fill="#5b6b78">law-soc</text>
  <text class="t" x="884" y="334" text-anchor="middle" font-size="10.5" fill="#152028">local4 → CommonSecurityLog</text>
  <text class="t" x="884" y="352" text-anchor="middle" font-size="10.5" fill="#152028">local5 → Syslog</text>
  <path d="M754 316H806" stroke="#0b8a8a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahl)"/>
  <text class="m" x="780" y="306" text-anchor="middle" font-size="10" fill="#5b6b78">NAT gw</text>

  <!-- legend -->
  <path d="M28 412H56" stroke="#152028" stroke-width="1.6"/>
  <text class="t" x="62" y="416" font-size="12" fill="#5b6b78">client traffic</text>
  <path d="M150 412H178" stroke="#0b8a8a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="t" x="184" y="416" font-size="12" fill="#5b6b78">log flow</text>
</svg>
