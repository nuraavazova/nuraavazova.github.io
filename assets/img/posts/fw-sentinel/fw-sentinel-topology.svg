<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Topology: client traffic goes through the firewall trust and untrust interfaces to the internet; firewall logs go from the management interface to a log forwarder and on to Microsoft Sentinel.">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14171a"/></marker>
    <marker id="grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2c5e45"/></marker>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .sans{font-family:'Source Sans Pro',Helvetica,Arial,sans-serif}
    .mono{font-family:Menlo,Consolas,monospace}
    .cap{font-family:'Source Sans Pro',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.12em;fill:#6b6a63}
    .box{fill:#ffffff;stroke:#d9d6cc;stroke-width:1.2}
    .name{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:16px;fill:#14171a}
    .txt{font-family:'Source Sans Pro',Helvetica,Arial,sans-serif;font-size:13px;fill:#2a2a2a}
    .ip{font-family:Menlo,Consolas,monospace;font-size:12px;fill:#2a2a2a}
    .note{font-family:'Source Sans Pro',Helvetica,Arial,sans-serif;font-size:12px;font-style:italic;fill:#6b6a63}
  </style>

  <rect width="1000" height="470" rx="14" fill="#f9f8f4" stroke="#d9d6cc"/>

  <!-- Title -->
  <text class="cap" x="28" y="34">FIGURE 1 · TWO FLOWS THROUGH ONE VNET</text>
  <line x1="28" y1="44" x2="972" y2="44" stroke="#d9d6cc"/>

  <!-- VNet frame -->
  <rect x="22" y="64" width="756" height="372" rx="10" fill="none" stroke="#b9b5a8" stroke-dasharray="4 5"/>
  <text class="cap" x="38" y="84">VNET · 10.20.0.0/16</text>

  <!-- Client -->
  <rect class="box" x="40" y="100" width="150" height="104" rx="8"/>
  <rect x="40" y="100" width="4" height="104" fill="#2c5e45"/>
  <text class="cap" x="58" y="122">SNET-CLIENT</text>
  <text class="name" x="58" y="146">client01</text>
  <text class="ip" x="58" y="168">10.20.3.10</text>
  <text class="note" x="58" y="190">no public IP</text>

  <!-- UDR -->
  <rect x="40" y="226" width="172" height="54" rx="8" fill="none" stroke="#2c5e45" stroke-dasharray="3 4"/>
  <text class="sans" x="56" y="248" font-size="13" font-weight="700" fill="#14171a">route table</text>
  <text class="ip" x="56" y="268" font-size="11">0.0.0.0/0 → 10.20.2.4</text>
  <line x1="115" y1="204" x2="115" y2="226" stroke="#2c5e45" stroke-dasharray="3 4"/>

  <!-- Trust -->
  <rect class="box" x="222" y="100" width="140" height="104" rx="8"/>
  <text class="cap" x="238" y="122">SNET-TRUST</text>
  <text class="name" x="238" y="146">ethernet1/2</text>
  <text class="ip" x="238" y="168">10.20.2.4</text>
  <text class="note" x="238" y="190">Trust zone</text>

  <!-- Firewall (hero) -->
  <rect x="396" y="88" width="180" height="128" rx="10" fill="#2c5e45"/>
  <text x="414" y="112" font-family="'Source Sans Pro',Helvetica,Arial,sans-serif" font-size="11" letter-spacing=".12em" fill="#cfe0d6">PALO ALTO VM-SERIES</text>
  <text x="414" y="138" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="20" fill="#ffffff">fw01</text>
  <text x="414" y="162" font-family="'Source Sans Pro',Helvetica,Arial,sans-serif" font-size="13" fill="#e8f0eb">rule allow-web-out</text>
  <text x="414" y="180" font-family="'Source Sans Pro',Helvetica,Arial,sans-serif" font-size="13" fill="#e8f0eb">NAT client-snat</text>
  <text x="414" y="198" font-family="'Source Sans Pro',Helvetica,Arial,sans-serif" font-size="13" fill="#e8f0eb">log fwd LF-Sentinel</text>

  <!-- Untrust -->
  <rect class="box" x="610" y="100" width="150" height="104" rx="8"/>
  <text class="cap" x="626" y="122">SNET-UNTRUST</text>
  <text class="name" x="626" y="146">ethernet1/1</text>
  <text class="ip" x="626" y="168">10.20.1.4</text>
  <text class="note" x="626" y="190">+ public IP</text>

  <!-- Internet -->
  <rect x="812" y="114" width="166" height="76" rx="8" fill="none" stroke="#14171a" stroke-width="1.2"/>
  <text class="name" x="830" y="148">Internet</text>
  <text class="note" x="830" y="170">public website</text>

  <!-- Client flow -->
  <path d="M190 152H220" stroke="#14171a" stroke-width="1.6" marker-end="url(#ink)"/>
  <path d="M362 152H394" stroke="#14171a" stroke-width="1.6" marker-end="url(#ink)"/>
  <path d="M576 152H608" stroke="#14171a" stroke-width="1.6" marker-end="url(#ink)"/>
  <path d="M760 152H810" stroke="#14171a" stroke-width="1.6" marker-end="url(#ink)"/>
  <text class="cap" x="786" y="140" text-anchor="middle" font-size="9">SNAT</text>

  <!-- Mgmt -->
  <rect class="box" x="396" y="292" width="180" height="104" rx="8"/>
  <text class="cap" x="414" y="314">SNET-MGMT</text>
  <text class="name" x="414" y="338">MGT interface</text>
  <text class="ip" x="414" y="360">10.20.0.4</text>
  <text class="note" x="414" y="382">admin + syslog source</text>
  <line x1="486" y1="216" x2="486" y2="292" stroke="#14171a" stroke-width="1.2"/>
  <text class="note" x="496" y="258">same VM, NIC 1</text>
  <text class="note" x="300" y="336" text-anchor="end">HTTPS 443 from one /32</text>
  <path d="M306 332H394" stroke="#6b6a63" stroke-dasharray="2 3" marker-end="url(#ink)"/>

  <!-- Logs -->
  <rect class="box" x="610" y="292" width="150" height="104" rx="8"/>
  <rect x="610" y="292" width="4" height="104" fill="#2c5e45"/>
  <text class="cap" x="628" y="314">SNET-LOGS</text>
  <text class="name" x="628" y="338">log-fwd01</text>
  <text class="ip" x="628" y="360">10.20.4.10</text>
  <text class="note" x="628" y="382">rsyslog + AMA</text>
  <path d="M576 344H608" stroke="#2c5e45" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#grn)"/>
  <text class="cap" x="593" y="418" text-anchor="middle" font-size="10">TCP 514</text>
  <line x1="593" y1="348" x2="593" y2="406" stroke="#2c5e45" stroke-width=".8" stroke-dasharray="2 3"/>

  <!-- Sentinel -->
  <rect x="812" y="292" width="166" height="104" rx="8" fill="#ffffff" stroke="#2c5e45" stroke-width="1.6"/>
  <text class="cap" x="828" y="314">MICROSOFT</text>
  <text class="name" x="828" y="338">Sentinel</text>
  <text class="sans" x="828" y="360" font-size="12" fill="#2a2a2a">local4 → CommonSecurityLog</text>
  <text class="sans" x="828" y="380" font-size="12" fill="#2a2a2a">local5 → Syslog</text>
  <path d="M760 344H810" stroke="#2c5e45" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#grn)"/>
  <text class="cap" x="786" y="330" text-anchor="middle" font-size="9">NAT GW</text>

  <!-- Legend -->
  <path d="M40 456H70" stroke="#14171a" stroke-width="1.6"/>
  <text class="sans" x="78" y="460" font-size="12" fill="#6b6a63">client traffic</text>
  <path d="M170 456H200" stroke="#2c5e45" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="sans" x="208" y="460" font-size="12" fill="#6b6a63">log flow</text>
</svg>
